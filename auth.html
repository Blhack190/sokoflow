<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soko Flow — Sign In & Register Account</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: linear-gradient(135deg, var(--dark-base), var(--purple-deep)); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1rem;">

  <div class="glass-card" style="width: 100%; max-width: 520px; background: var(--dark-surface); border-color: var(--dark-border); color: #fff; padding: 2.5rem;">
    
    <div style="text-align: center; margin-bottom: 1.8rem;">
      <a href="index.html" class="brand-logo" style="justify-content: center; color: var(--pure-white);">⚡ Soko Flow</a>
      <p style="color: var(--text-light); font-size: 0.9rem; margin-top: 0.4rem;">Select Account Type to Continue</p>
    </div>

    <!-- SELLER VS BUYER ROLE SELECTION BAR -->
    <div style="background: rgba(124, 58, 237, 0.2); padding: 6px; border-radius: 10px; border: 1px solid var(--border-subtle); margin-bottom: 1.5rem; display: flex; text-align: center;">
      <button id="roleSellerBtn" onclick="selectUserType('SELLER')" style="flex: 1; padding: 0.6rem; border: none; border-radius: 8px; font-weight: 800; font-size: 0.88rem; cursor: pointer; background: var(--purple-primary); color: #fff;">
        🛍️ Seller / Merchant
      </button>
      <button id="roleBuyerBtn" onclick="selectUserType('BUYER')" style="flex: 1; padding: 0.6rem; border: none; border-radius: 8px; font-weight: 800; font-size: 0.88rem; cursor: pointer; background: transparent; color: var(--text-light);">
        🛒 Buyer / Customer
      </button>
    </div>

    <!-- SOCIAL LOGINS -->
    <div style="display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 1.8rem;">
      <button onclick="signInWithProvider('google')" class="btn" style="background: #ffffff; color: #1f2937; font-weight: 700; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        <span>Continue with Google / Gmail</span>
      </button>
    </div>

    <!-- TOGGLE TABS -->
    <div style="display: flex; background: rgba(0,0,0,0.3); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 1.8rem; border: 1px solid var(--dark-border);">
      <button id="tabLoginBtn" onclick="switchAuthTab('login')" style="flex: 1; padding: 0.75rem; border: none; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; background: var(--purple-primary); color: #fff;">Sign In</button>
      <button id="tabRegisterBtn" onclick="switchAuthTab('register')" style="flex: 1; padding: 0.75rem; border: none; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; background: transparent; color: var(--text-light);">Create Account</button>
    </div>

    <!-- 1. LOGIN FORM -->
    <form id="loginForm" onsubmit="handleAuthSubmit(event, 'login')">
      <div style="margin-bottom: 1.2rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: #D1D5DB;">Email Address</label>
        <input type="email" id="loginEmail" required placeholder="user@sokoflow.com" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--dark-border); background: #1F1538; color: #fff;">
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: #D1D5DB;">Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--dark-border); background: #1F1538; color: #fff;">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem; font-size: 1rem;" id="loginSubmitBtn">Sign In to Dashboard</button>
    </form>

    <!-- 2. REGISTER FORM -->
    <form id="registerForm" onsubmit="handleAuthSubmit(event, 'register')" style="display: none;">
      <div style="margin-bottom: 1rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: #D1D5DB;">Full Name</label>
        <input type="text" id="regName" required placeholder="Jane Doe" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--dark-border); background: #1F1538; color: #fff;">
      </div>

      <div id="sellerFieldsGroup">
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: #D1D5DB;">Store / Business Name</label>
          <input type="text" id="regStore" placeholder="Luxe Apparel" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--dark-border); background: #1F1538; color: #fff;">
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: #D1D5DB;">Receiving MoMo Number</label>
          <input type="text" id="regMomoNumber" placeholder="0244123456" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--dark-border); background: #1F1538; color: #fff;">
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: #D1D5DB;">MoMo Account Name</label>
          <input type="text" id="regMomoName" placeholder="Jane Doe (Luxe Apparel)" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--dark-border); background: #1F1538; color: #fff;">
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: #D1D5DB;">WhatsApp Phone Number</label>
          <input type="tel" id="regWhatsappPhone" placeholder="+233244123456" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--dark-border); background: #1F1538; color: #fff;">
        </div>
      </div>

      <div style="margin-bottom: 1rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: #D1D5DB;">Email Address</label>
        <input type="email" id="regEmail" required placeholder="jane@luxe.com" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--dark-border); background: #1F1538; color: #fff;">
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.4rem; color: #D1D5DB;">Create Password</label>
        <input type="password" id="regPassword" required placeholder="••••••••" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--dark-border); background: #1F1538; color: #fff;">
      </div>

      <button type="submit" class="btn btn-gold" style="width: 100%; padding: 0.9rem; font-size: 1rem;" id="regSubmitBtn">Create Seller Account</button>
    </form>

  </div>

  <script src="js/app.js"></script>
  <script>
    let selectedUserRole = 'SELLER';

    function selectUserType(role) {
      selectedUserRole = role;
      const sellerBtn = document.getElementById('roleSellerBtn');
      const buyerBtn = document.getElementById('roleBuyerBtn');
      const sellerFields = document.getElementById('sellerFieldsGroup');
      const loginBtn = document.getElementById('loginSubmitBtn');
      const regBtn = document.getElementById('regSubmitBtn');

      if (role === 'SELLER') {
        sellerBtn.style.background = 'var(--purple-primary)';
        sellerBtn.style.color = '#fff';
        buyerBtn.style.background = 'transparent';
        buyerBtn.style.color = 'var(--text-light)';
        if (sellerFields) sellerFields.style.display = 'block';
        loginBtn.innerText = 'Sign In to Seller Dashboard';
        regBtn.innerText = 'Create Seller Account';
      } else {
        buyerBtn.style.background = 'var(--purple-primary)';
        buyerBtn.style.color = '#fff';
        sellerBtn.style.background = 'transparent';
        sellerBtn.style.color = 'var(--text-light)';
        if (sellerFields) sellerFields.style.display = 'none';
        loginBtn.innerText = 'Sign In to Customer Store';
        regBtn.innerText = 'Create Buyer Account';
      }
    }

    async function signInWithProvider(provider) {
      SokoFlow.showToast(`Redirecting to ${provider.toUpperCase()} Authentication...`, 'info');
      setTimeout(() => {
        window.location.href = selectedUserRole === 'SELLER' ? 'dashboard.html' : 'store.html';
      }, 1000);
    }

    function switchAuthTab(tab) {
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('tabLoginBtn').style.background = tab === 'login' ? 'var(--purple-primary)' : 'transparent';
      document.getElementById('tabRegisterBtn').style.background = tab === 'register' ? 'var(--purple-primary)' : 'transparent';
    }

    async function handleAuthSubmit(e, type) {
      e.preventDefault();

      if (type === 'register' && selectedUserRole === 'SELLER') {
        const storeDetails = {
          ownerName: document.getElementById('regName').value,
          storeName: document.getElementById('regStore').value || 'Luxe Store',
          email: document.getElementById('regEmail').value,
          momoNumber: document.getElementById('regMomoNumber').value || '0244123456',
          momoName: document.getElementById('regMomoName').value || 'Jane Doe',
          whatsappPhone: document.getElementById('regWhatsappPhone').value || '+233244123456',
          whatsappGroup: 'https://chat.whatsapp.com/demo-group-link'
        };
        SokoFlow.saveSellerStoreInfo(storeDetails);
      }

      SokoFlow.showToast(`Authenticating ${selectedUserRole}...`, 'info');
      setTimeout(() => {
        window.location.href = selectedUserRole === 'SELLER' ? 'dashboard.html' : 'store.html';
      }, 1000);
    }
  </script>
</body>
</html>
